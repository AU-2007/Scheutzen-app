name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: sudo "$(which python)" -m pip install -q -r requirements.txt
      - name: App-Tests
        run: python tests/run_all.py
      - name: Wartungsskripte (als root)
        run: sudo -E env "PATH=$PATH" "$(which python)" tests/run_all.py --nur-root
