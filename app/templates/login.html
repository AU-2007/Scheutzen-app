{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="login">
  <img class="login-logo" src="{{ url_for('static', filename='img/icon-512.png') }}" alt="Vereinswappen" width="150" height="150">
  <h1>{{ VEREIN }}</h1>
  <p class="muted">Mannschaftsverwaltung</p>
  <form method="post" class="card stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Benutzername<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary">Anmelden</button>
  </form>
  {% if passkeys_ok %}
  <div class="passkey-alt">
    <button type="button" class="btn" hidden data-passkey-login="{{ url_for('passkey_login') }}"
            data-options-url="{{ url_for('passkey_login_options') }}" data-next="{{ request.args.get('next', '') }}">🔑 Mit Passkey anmelden</button>
    <p class="pk-msg flash error" hidden></p>
  </div>
  <script src="{{ url_for('static', filename='js/passkey.js') }}"></script>
  {% endif %}
</div>
{% endblock %}
