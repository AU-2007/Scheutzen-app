{% extends "base.html" %}
{% block title %}Passwort ändern{% endblock %}
{% block content %}
<h1>Passwort ändern</h1>
<form method="post" class="card stack narrow">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Aktuelles Passwort<input name="old" type="password" autocomplete="current-password" required></label>
  <label>Neues Passwort <span class="muted small">(mind. 8 Zeichen)</span><input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Neues Passwort wiederholen<input name="new2" type="password" autocomplete="new-password" minlength="8" required></label>
  <button class="btn primary">Speichern</button>
</form>
{% endblock %}
